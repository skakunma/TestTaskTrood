version: '3.9'
services:
  Server:
    image: testtasktrood:latest
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDRESS=:8080
      - HOST_SPACY=Spacy
      - PORT_SPACY=8000
      - FLASK_ENV=development
      - DATABASE_URL=host=Postgres user=postgres password=example dbname=TestTask sslmode=disable
    networks:
      - app_network
    depends_on:
      - Postgres

  Postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: TestTask
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - "5435:5432"

  Spacy:
    image: spacy-service:latest
    environment:
      - HOST_SPACY=0.0.0.0
      - PORT_SPACY=8000
    ports:
      - "8001:8000"
    networks:
    - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
